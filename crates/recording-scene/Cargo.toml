[package]
name = "recording-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
assets = { path = "../assets" }
bytemuck = { version = "1", features = ["min_const_generics"] }
crossbeam-channel = "0.5"
flate2 = "1"
glam.workspace = true
meshing = { path = "../meshing" }
particles = { path = "../particles" }
recording-studio = { path = "../recording-studio" }
render-model = { path = "../render-model" }
render-api = { path = "../render-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
world = { path = "../world" }

[lints]
workspace = true
